<svg width="1000" height="430" viewBox="0 0 1000 430"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Neon Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Background -->
    <linearGradient id="background"
                    x1="0" y1="0"
                    x2="1" y2="1">

      <stop offset="0%" stop-color="#08000f"/>
      <stop offset="50%" stop-color="#12001f"/>
      <stop offset="100%" stop-color="#06000d"/>

    </linearGradient>

    <!-- Scanline -->
    <linearGradient id="scanline"
                    x1="0" y1="0"
                    x2="1" y2="0">

      <stop offset="0%" stop-color="#b000ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#b000ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#b000ff" stop-opacity="0"/>

    </linearGradient>

  </defs>


  <!-- MAIN PANEL -->

  <rect x="12"
        y="12"
        width="976"
        height="406"
        rx="14"
        fill="url(#background)"
        stroke="#a900ff"
        stroke-width="2"
        filter="url(#glow)"/>


  <!-- INNER BORDER -->

  <rect x="24"
        y="24"
        width="952"
        height="382"
        rx="10"
        fill="none"
        stroke="#5f00a8"
        stroke-width="1"
        opacity="0.7"/>


  <!-- CYBERPUNK CORNERS -->

  <path d="M45 95 V45 H105"
        fill="none"
        stroke="#d000ff"
        stroke-width="4"
        filter="url(#strongGlow)"/>

  <path d="M895 45 H955 V95"
        fill="none"
        stroke="#d000ff"
        stroke-width="4"
        filter="url(#strongGlow)"/>

  <path d="M45 335 V385 H105"
        fill="none"
        stroke="#d000ff"
        stroke-width="4"
        filter="url(#strongGlow)"/>

  <path d="M895 385 H955 V335"
        fill="none"
        stroke="#d000ff"
        stroke-width="4"
        filter="url(#strongGlow)"/>


  <!-- HEADER -->

  <text x="55"
        y="70"
        fill="#d000ff"
        font-family="monospace"
        font-size="20"
        font-weight="bold"
        letter-spacing="4"
        filter="url(#glow)">

    // DEVELOPER PROFILE

  </text>


  <!-- STATUS -->

  <circle cx="915"
          cy="63"
          r="6"
          fill="#d000ff"
          filter="url(#glow)">

    <animate
      attributeName="opacity"
      values="1;0.25;1"
      dur="1.2s"
      repeatCount="indefinite"/>

  </circle>


  <text x="935"
        y="69"
        text-anchor="end"
        fill="#d000ff"
        font-family="monospace"
        font-size="12"
        letter-spacing="2">

    PROFILE_LOADED

  </text>


  <!-- HEADER LINE -->

  <line x1="55"
        y1="92"
        x2="945"
        y2="92"
        stroke="#7b00c7"
        stroke-width="1"/>


  <!-- LABELS -->

  <g font-family="monospace"
     font-size="18">

    <text x="65" y="135"
          fill="#ff4dff">
      NAME
    </text>

    <text x="65" y="180"
          fill="#ff4dff">
      ROLE
    </text>

    <text x="65" y="225"
          fill="#ff4dff">
      DOMAIN
    </text>

    <text x="65" y="270"
          fill="#ff4dff">
      STATUS
    </text>

    <text x="65" y="340"
          fill="#ff4dff">
      MISSION
    </text>

  </g>


  <!-- COLONS -->

  <g fill="#7b00c7"
     font-family="monospace"
     font-size="18">

    <text x="190" y="135">:</text>
    <text x="190" y="180">:</text>
    <text x="190" y="225">:</text>
    <text x="190" y="270">:</text>
    <text x="190" y="340">:</text>

  </g>


  <!-- VALUES -->

  <g font-family="monospace"
     font-size="18"
     fill="#f2d9ff">

    <text x="215" y="135">
      GAYATHRI
    </text>

    <text x="215" y="180">
      INFORMATION SCIENCE ENGINEER
    </text>

    <text x="215" y="225">
      AI / ML / COMPUTER VISION
    </text>

    <text x="215" y="270"
          fill="#d000ff"
          filter="url(#glow)">

      ● BUILDING

    </text>

  </g>


  <!-- MISSION -->

  <text x="215"
        y="340"
        fill="#f2d9ff"
        font-family="monospace"
        font-size="18">

    LEARN → BUILD → EXPERIMENT → REPEAT

  </text>


  <!-- BOTTOM SYSTEM LINE -->

  <line x1="55"
        y1="370"
        x2="945"
        y2="370"
        stroke="#5f00a8"
        stroke-width="1"/>


  <!-- SYSTEM MESSAGE -->

  <text x="55"
        y="395"
        fill="#8f38b8"
        font-family="monospace"
        font-size="11"
        letter-spacing="2">

    SYSTEM LOG // DEVELOPER PROFILE ACTIVE

  </text>


  <!-- MOVING SCANLINE -->

  <rect x="45"
        y="100"
        width="910"
        height="2"
        fill="url(#scanline)"
        opacity="0.7">

    <animate
      attributeName="y"
      values="100;365;100"
      dur="5s"
      repeatCount="indefinite"/>

  </rect>

</svg>
