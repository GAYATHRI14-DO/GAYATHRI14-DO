<svg width="1000" height="560" viewBox="0 0 1000 560"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08000f"/>
      <stop offset="50%" stop-color="#14001f"/>
      <stop offset="100%" stop-color="#05000c"/>
    </linearGradient>

  </defs>

  <!-- MAIN PANEL -->

  <rect x="12" y="12"
        width="976" height="536"
        rx="14"
        fill="url(#bg)"
        stroke="#a900ff"
        stroke-width="2"
        filter="url(#glow)"/>

  <!-- INNER BORDER -->

  <rect x="25" y="25"
        width="950" height="510"
        rx="10"
        fill="none"
        stroke="#5f00a8"
        opacity="0.7"/>


  <!-- CORNERS -->

  <path d="M45 95 V45 H105"
        fill="none"
        stroke="#d000ff"
        stroke-width="4"
        filter="url(#strongGlow)"/>

  <path d="M895 45 H955 V95"
        fill="none"
        stroke="#d000ff"
        stroke-width="4"
        filter="url(#strongGlow)"/>

  <path d="M45 465 V515 H105"
        fill="none"
        stroke="#d000ff"
        stroke-width="4"
        filter="url(#strongGlow)"/>

  <path d="M895 515 H955 V465"
        fill="none"
        stroke="#d000ff"
        stroke-width="4"
        filter="url(#strongGlow)"/>


  <!-- HEADER -->

  <text x="55" y="70"
        fill="#d000ff"
        font-family="monospace"
        font-size="20"
        font-weight="bold"
        letter-spacing="4"
        filter="url(#glow)">
    // SKILL MATRIX
  </text>

  <text x="945" y="70"
