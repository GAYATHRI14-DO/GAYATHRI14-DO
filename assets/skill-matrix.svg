  <!-- CATEGORY 1 -->

  <text x="65" y="130"
        fill="#ff4dff"
        font-family="monospace"
        font-size="16"
        font-weight="bold">
    AI / MACHINE LEARNING
  </text>

  <text x="65" y="157"
        fill="#f2d9ff"
        font-family="monospace"
