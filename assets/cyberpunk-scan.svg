<svg width="1000" height="420" viewBox="0 0 1000 420"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Main Violet Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Strong Violet Glow -->
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05020D"/>
      <stop offset="45%" stop-color="#0B0318"/>
      <stop offset="70%" stop-color="#120522"/>
      <stop offset="100%" stop-color="#05020D"/>
    </linearGradient>

    <!-- Scan Line -->
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7A00FF" stop-opacity="0"/>
      <stop offset="35%" stop-color="#9D00FF"/>
      <stop offset="50%" stop-color="#E100FF"/>
      <stop offset="65%" stop-color="#9D00FF"/>
      <stop offset="100%" stop-color="#7A00FF" stop-opacity="0"/>
    </linearGradient>

    <!-- Progress Gradient -->
    <linearGradient id="progress" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6A00FF"/>
      <stop offset="50%" stop-color="#B000FF"/>
      <stop offset="100%" stop-color="#FF2DFF"/>
    </linearGradient>

    <!-- Radar Gradient -->
    <radialGradient id="radar">
      <stop offset="0%" stop-color="#B000FF" stop-opacity="0.20"/>
      <stop offset="60%" stop-color="#6A00FF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

  </defs>


  <!-- BACKGROUND -->

  <rect width="1000"
        height="420"
        rx="20"
        fill="url(#bg)"
        stroke="#A600FF"
        stroke-width="2"
        opacity="0.98"
        filter="url(#glow)"/>


  <!-- OUTER HUD BORDER -->

  <rect x="15"
        y="15"
        width="970"
        height="390"
        rx="16"
        fill="none"
        stroke="#8A00FF"
        stroke-width="1"
        opacity="0.7"/>


  <!-- DECORATIVE CORNERS -->

  <path d="M30 85 V30 H85"
        fill="none"
        stroke="#B000FF"
        stroke-width="3"
        filter="url(#glow)"/>

  <path d="M915 30 H970 V85"
        fill="none"
        stroke="#B000FF"
        stroke-width="3"
        filter="url(#glow)"/>

  <path d="M30 335 V390 H85"
        fill="none"
        stroke="#B000FF"
        stroke-width="3"
        filter="url(#glow)"/>

  <path d="M915 390 H970 V335"
        fill="none"
        stroke="#B000FF"
        stroke-width="3"
        filter="url(#glow)"/>


  <!-- SMALL HUD CORNER DETAILS -->

  <path d="M55 55 H145"
        stroke="#7A00FF"
        stroke-width="2"
        opacity="0.7"/>

  <path d="M855 55 H945"
        stroke="#7A00FF"
        stroke-width="2"
        opacity="0.7"/>

  <path d="M55 365 H145"
        stroke="#7A00FF"
        stroke-width="2"
        opacity="0.7"/>

  <path d="M855 365 H945"
        stroke="#7A00FF"
        stroke-width="2"
        opacity="0.7"/>


  <!-- TOP STATUS -->

  <text x="500"
        y="55"
        text-anchor="middle"
        fill="#D000FF"
        font-family="monospace"
        font-size="18"
        letter-spacing="5"
        filter="url(#glow)">

    IDENTITY SCAN // INITIALIZING

    <animate
      attributeName="opacity"
      values="1;0.35;1"
      dur="1.5s"
      repeatCount="indefinite"/>

  </text>


  <!-- TOP HUD DOTS -->

  <circle cx="270" cy="55" r="3" fill="#B000FF">
    <animate
      attributeName="opacity"
      values="1;0.2;1"
      dur="1s"
      repeatCount="indefinite"/>
  </circle>

  <circle cx="285" cy="55" r="3" fill="#B000FF">
    <animate
      attributeName="opacity"
      values="0.2;1;0.2"
      dur="1s"
      repeatCount="indefinite"/>
  </circle>

  <circle cx="300" cy="55" r="3" fill="#B000FF"/>


  <!-- RADAR BACKGROUND -->

  <circle cx="500"
          cy="190"
          r="120"
          fill="url(#radar)"/>


  <!-- RADAR RINGS -->

  <circle cx="500"
          cy="190"
          r="105"
          fill="none"
          stroke="#8A00FF"
          stroke-width="1"
          opacity="0.35"/>

  <circle cx="500"
          cy="190"
          r="80"
          fill="none"
          stroke="#A600FF"
          stroke-width="1"
          opacity="0.5"/>

  <circle cx="500"
          cy="190"
          r="55"
          fill="none"
          stroke="#C000FF"
          stroke-width="2"
          opacity="0.75"
          filter="url(#glow)"/>


  <!-- RADAR CROSSHAIR -->

  <line x1="500"
        y1="80"
        x2="500"
        y2="300"
        stroke="#8A00FF"
        stroke-width="1"
        opacity="0.25"/>

  <line x1="390"
        y1="190"
        x2="610"
        y2="190"
        stroke="#8A00FF"
        stroke-width="1"
        opacity="0.25"/>


  <!-- ROTATING RADAR -->

  <g transform="translate(500 190)">

    <line x1="0"
          y1="0"
          x2="0"
          y2="-105"
          stroke="#E100FF"
          stroke-width="2"
          opacity="0.9"
          filter="url(#strongGlow)">

      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0"
        to="360"
        dur="3s"
        repeatCount="indefinite"/>

    </line>

  </g>


  <!-- RADAR CENTER -->

  <circle cx="500"
          cy="190"
          r="6"
          fill="#FF2DFF"
          filter="url(#strongGlow)">

    <animate
      attributeName="r"
      values="4;8;4"
      dur="1.5s"
      repeatCount="indefinite"/>

  </circle>


  <!-- SUBJECT -->

  <text x="500"
        y="175"
        text-anchor="middle"
        fill="#FFFFFF"
        font-family="monospace"
        font-size="42"
        font-weight="bold"
        letter-spacing="8"
        filter="url(#strongGlow)">

    GAYATHRI

    <animate
      attributeName="opacity"
      values="0;0;1;1;1;0.4;1"
      keyTimes="0;0.2;0.35;0.6;0.7;0.75;1"
      dur="4s"
      repeatCount="indefinite"/>

  </text>


  <!-- ROLE -->

  <text x="500"
        y="215"
        text-anchor="middle"
        fill="#D98AFF"
        font-family="monospace"
        font-size="15"
        letter-spacing="4">

    DEVELOPER // AI // COMPUTER VISION

  </text>


  <!-- SCAN LINE -->

  <rect x="120"
        y="90"
        width="760"
        height="3"
        rx="2"
        fill="url(#scan)"
        filter="url(#strongGlow)">

    <animate
      attributeName="y"
      values="90;290;90"
      dur="2.5s"
      repeatCount="indefinite"/>

  </rect>


  <!-- LEFT DATA PANEL -->

  <text x="75"
        y="290"
        fill="#C000FF"
        font-family="monospace"
        font-size="13"
        filter="url(#glow)">

    SUBJECT : GAYATHRI

  </text>

  <text x="75"
        y="315"
        fill="#C000FF"
        font-family="monospace"
        font-size="13"
        filter="url(#glow)">

    STATUS  : ONLINE

  </text>


  <!-- RIGHT DATA PANEL -->

  <text x="925"
        y="290"
        text-anchor="end"
        fill="#C000FF"
        font-family="monospace"
        font-size="13"
        filter="url(#glow)">

    CLASS : DEVELOPER

  </text>

  <text x="925"
        y="315"
        text-anchor="end"
        fill="#C000FF"
        font-family="monospace"
        font-size="13"
        filter="url(#glow)">

    ACCESS : PUBLIC

  </text>


  <!-- PROGRESS BAR BACKGROUND -->

  <rect x="250"
        y="340"
        width="500"
        height="8"
        rx="4"
        fill="#16051F"
        stroke="#8A00FF"
        stroke-width="1"/>


  <!-- PROGRESS BAR -->

  <rect x="250"
        y="340"
        width="0"
        height="8"
        rx="4"
        fill="url(#progress)"
        filter="url(#strongGlow)">

    <animate
      attributeName="width"
      values="0;500;500;0"
      keyTimes="0;0.45;0.7;1"
      dur="4s"
      repeatCount="indefinite"/>

  </rect>


  <!-- PROGRESS MARKERS -->

  <g fill="#B000FF">

    <rect x="260" y="353" width="3" height="5"/>
    <rect x="280" y="353" width="3" height="5"/>
    <rect x="300" y="353" width="3" height="5"/>
    <rect x="320" y="353" width="3" height="5"/>
    <rect x="340" y="353" width="3" height="5"/>
    <rect x="360" y="353" width="3" height="5"/>
    <rect x="380" y="353" width="3" height="5"/>
    <rect x="400" y="353" width="3" height="5"/>
    <rect x="420" y="353" width="3" height="5"/>
    <rect x="440" y="353" width="3" height="5"/>
    <rect x="460" y="353" width="3" height="5"/>
    <rect x="480" y="353" width="3" height="5"/>
    <rect x="500" y="353" width="3" height="5"/>
    <rect x="520" y="353" width="3" height="5"/>
    <rect x="540" y="353" width="3" height="5"/>
    <rect x="560" y="353" width="3" height="5"/>
    <rect x="580" y="353" width="3" height="5"/>
    <rect x="600" y="353" width="3" height="5"/>
    <rect x="620" y="353" width="3" height="5"/>
    <rect x="640" y="353" width="3" height="5"/>
    <rect x="660" y="353" width="3" height="5"/>
    <rect x="680" y="353" width="3" height="5"/>
    <rect x="700" y="353" width="3" height="5"/>
    <rect x="720" y="353" width="3" height="5"/>

  </g>


  <!-- ACCESS GRANTED -->

  <text x="500"
        y="385"
        text-anchor="middle"
        fill="#E100FF"
        font-family="monospace"
        font-size="17"
        font-weight="bold"
        letter-spacing="5"
        filter="url(#strongGlow)">

    ACCESS GRANTED ✓

    <animate
      attributeName="opacity"
      values="0;0;1;1;0"
      keyTimes="0;0.55;0.65;0.9;1"
      dur="4s"
      repeatCount="indefinite"/>

  </text>

</svg>
