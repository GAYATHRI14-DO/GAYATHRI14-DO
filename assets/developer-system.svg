     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- ================================================= -->
    <!-- NEON GLOW -->
    <!-- ================================================= -->

    <filter id="glow"
            x="-50%"
            y="-50%"
            width="200%"
            height="200%">

      <feGaussianBlur stdDeviation="4"
                      result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>


    <!-- ================================================= -->
    <!-- SOFT GLOW -->
    <!-- ================================================= -->

    <filter id="softGlow"
            x="-50%"
            y="-50%"
            width="200%"
            height="200%">

      <feGaussianBlur stdDeviation="2"
                      result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>


    <!-- ================================================= -->
    <!-- CYBER GRID -->
    <!-- ================================================= -->

    <pattern id="grid"
             width="25"
             height="25"
             patternUnits="userSpaceOnUse">

      <path d="M 25 0 L 0 0 0 25"
            fill="none"
            stroke="#26002f"
            stroke-width="0.6"/>

    </pattern>

  </defs>


