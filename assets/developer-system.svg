<svg width="1000" height="920" viewBox="0 0 1000 920"
xmlns="http://www.w3.org/2000/svg">

<defs>

  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#08000f"/>
    <stop offset="50%" stop-color="#14001f"/>
    <stop offset="100%" stop-color="#05000c"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="strongGlow">
    <feGaussianBlur stdDeviation="6" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

</defs>


<!-- ================================================= -->
<!-- MAIN CONTINUOUS PANEL -->
<!-- ================================================= -->

<rect x="12" y="12"
      width="976" height="896"
      rx="16"
      fill="url(#bg)"
      stroke="#a900ff"
      stroke-width="2"
      filter="url(#glow)"/>

<rect x="25" y="25"
      width="950" height="870"
      rx="10"
      fill="none"
      stroke="#5f00a8"
      opacity="0.7"/>


<!-- ================================================= -->
<!-- CYBERPUNK CORNERS -->
<!-- ================================================= -->

<path d="M45 100 V45 H110"
      fill="none"
      stroke="#d000ff"
      stroke-width="4"
      filter="url(#strongGlow)"/>

<path d="M890 45 H955 V100"
      fill="none"
      stroke="#d000ff"
      stroke-width="4"
      filter="url(#strongGlow)"/>

<path d="M45 820 V875 H110"
